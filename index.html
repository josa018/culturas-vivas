<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Culturas Vivas</title>
    <!-- Render-blocking design system stylesheet -->
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Critical initial styles to prevent FOUC / canvas flash prior to script hydration -->
    <style>
      html,
      body {
        background-color: #111318;
        margin: 0;
        overflow: hidden;
      }
      a-scene:not(.cv-scene--active) {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <!-- 2D SPA Application Shell -->
    <div id="app"></div>

    <!-- WCAG Sensor Fallback Alert Container -->
    <div
      id="vr-status-message"
      role="status"
      aria-live="polite"
      style="
        display: none;
        background: rgba(0, 0, 0, 0.85);
        color: #ffffff;
        padding: 12px;
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        font-family: sans-serif;
        border-radius: 4px;
      "
    ></div>

    <!-- 3D WebXR Canvas (Controlled by ExperienceScreenView & QA sensors) -->
    <a-scene
      embedded
      control-sensores-qa
      loading-screen="enabled: false"
      vr-mode-ui="enabled: false"
      xr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets timeout="10000">
        <img id="sky-archaeology" src="/scenes/scene1.webp" />
        <img id="sky-textiles" src="/scenes/scene2.webp" />
        <!-- Standardized Exhibit Media Assets -->
        <img
          id="asset-painting-2d"
          src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='512' height='512'%3E%3Crect width='512' height='512' fill='%231e1e24'/%3E%3Ctext x='256' y='256' font-family='sans-serif' font-size='28' fill='%23ffffff' text-anchor='middle'%3ELIENZO 2D%3C/text%3E%3C/svg%3E"
        />
        <img
          id="asset-photo-stereo"
          src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1024' height='512'%3E%3Crect width='1024' height='512' fill='%23121212'/%3E%3Ctext x='512' y='256' font-family='sans-serif' font-size='32' fill='%234cc9f0' text-anchor='middle'%3EEST%C3%89REO SBS%3C/text%3E%3C/svg%3E"
        />
        <img
          id="asset-video-2d"
          src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='512' height='512'%3E%3Crect width='512' height='512' fill='%230f1416'/%3E%3Ctext x='256' y='256' font-family='sans-serif' font-size='28' fill='%23ffffff' text-anchor='middle'%3EVIDEO 2D%3C/text%3E%3C/svg%3E"
        />
        <img
          id="asset-video-stereo-sbs"
          src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1024' height='512'%3E%3Crect width='1024' height='512' fill='%231b0e24'/%3E%3Ctext x='512' y='256' font-family='sans-serif' font-size='32' fill='%23f72585' text-anchor='middle'%3EVIDEO SBS%3C/text%3E%3C/svg%3E"
        />
      </a-assets>

      <a-sky src="#sky-archaeology" rotation="0 -90 0"></a-sky>

      <a-light type="ambient" color="#ffffff" intensity="0.85"></a-light>
      <a-light
        type="directional"
        color="#ffffff"
        intensity="0.5"
        position="-1 4 2"
      ></a-light>

      <a-camera position="0 1.6 0">
        <a-cursor
          color="#38bdf8"
          fuse="true"
          fuse-timeout="1500"
          raycaster="objects: .clickable"
        ></a-cursor>
      </a-camera>
    </a-scene>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
