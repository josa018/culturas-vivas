<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Culturas Vivas</title>
    <!-- Render-blocking design system stylesheet -->
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Critical initial styles to prevent FOUC / canvas flash prior to script hydration -->
    <style>
      html,
      body {
        background-color: #111318;
        margin: 0;
        overflow: hidden;
      }
      a-scene:not(.cv-scene--active) {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <!-- 2D SPA Application Shell -->
    <div id="app"></div>

    <!-- WCAG Sensor Fallback Alert Container -->
    <div
      id="vr-status-message"
      role="status"
      aria-live="polite"
      style="
        display: none;
        background: rgba(0, 0, 0, 0.85);
        color: #ffffff;
        padding: 12px;
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        font-family: sans-serif;
        border-radius: 4px;
      "
    ></div>

    <!-- 3D WebXR Canvas (Controlled by ExperienceScreenView & QA sensors) -->
    <a-scene
      embedded
      control-sensores-qa
      cv-renderer-quality
      webxr="referenceSpaceType: local; requiredFeatures: local"
      renderer="antialias: true; anisotropy: 4; alpha: false; colorManagement: true; toneMapping: ACESFilmic; exposure: 1.05; foveationLevel: 0"
      shadow="type: pcf; autoUpdate: false"
      loading-screen="enabled: false"
      vr-mode-ui="enabled: false"
      xr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets timeout="10000"></a-assets>

      <a-entity id="cv-camera-rig" position="0 1.65 0">
        <a-camera position="0 0 0" near="0.1" far="80">
          <a-cursor
            cv-gaze-reticle
            position="0 0 0"
            material="opacity: 0; transparent: true"
            geometry="primitive: ring; radiusInner: 0.001; radiusOuter: 0.002"
            fuse="true"
            fuse-timeout="1500"
            raycaster="objects: .clickable"
          ></a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
