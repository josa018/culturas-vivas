<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <!-- Bead definition for authentic Wixárika chaquira texture -->
    <circle id="b" r="2.2" />
    <style>
      .bg { fill: #0B0E14; }
      .c-bk { fill: #11141A; }
      .c-wh { fill: #FFFFFF; }
      .c-rd { fill: #D62226; }
      .c-dr { fill: #8F1215; }
      .c-or { fill: #E86513; }
      .c-yl { fill: #F4B816; }
      .c-ly { fill: #F8E354; }
      .c-tq { fill: #00A896; }
      .c-lt { fill: #48CAE4; }
      .c-bl { fill: #023E8A; }
      .c-dg { fill: #0F4C3A; }
    </style>
  </defs>

  <!-- Base ribbon background -->
  <rect width="320" height="100" class="bg" />

  <!-- Outer frame borders (Top & Bottom edge bands) -->
  <g id="top-bottom-guards">
    <!-- Top outer guard -->
    <rect x="0" y="0" width="320" height="4" class="c-rd" />
    <rect x="0" y="4" width="320" height="3" class="c-yl" />
    <rect x="0" y="7" width="320" height="3" class="c-bk" />

    <!-- Bottom outer guard -->
    <rect x="0" y="90" width="320" height="3" class="c-bk" />
    <rect x="0" y="93" width="320" height="3" class="c-yl" />
    <rect x="0" y="96" width="320" height="4" class="c-rd" />
  </g>

  <!-- Continuous Running Sawtooth Waves (Water/Earth serpent borders) -->
  <!-- Upper sawtooth -->
  <path d="
    M 0,10 
    L 10,18 L 20,10 L 30,18 L 40,10 L 50,18 L 60,10 L 70,18 L 80,10 L 90,18 L 100,10 L 110,18 L 120,10 L 130,18 L 140,10 L 150,18 L 160,10 
    L 170,18 L 180,10 L 190,18 L 200,10 L 210,18 L 220,10 L 230,18 L 240,10 L 250,18 L 260,10 L 270,18 L 280,10 L 290,18 L 300,10 L 310,18 L 320,10
    L 320,14
    L 310,22 L 300,14 L 290,22 L 280,14 L 270,22 L 260,14 L 250,22 L 240,14 L 230,22 L 220,14 L 210,22 L 200,14 L 190,22 L 180,14 L 170,22 
    L 160,14 L 150,22 L 140,14 L 130,22 L 120,14 L 110,22 L 100,14 L 90,22 L 80,14 L 70,22 L 60,14 L 50,22 L 40,14 L 30,22 L 20,14 L 10,22 L 0,14 Z
  " class="c-tq" />

  <path d="
    M 0,14 
    L 10,22 L 20,14 L 30,22 L 40,14 L 50,22 L 60,14 L 70,22 L 80,14 L 90,22 L 100,14 L 110,22 L 120,14 L 130,22 L 140,14 L 150,22 L 160,14 
    L 170,22 L 180,14 L 190,22 L 200,14 L 210,22 L 220,14 L 230,22 L 240,14 L 250,22 L 260,14 L 270,22 L 280,14 L 290,22 L 300,14 L 310,22 L 320,14
    L 320,17
    L 310,25 L 300,17 L 290,25 L 280,17 L 270,25 L 260,17 L 250,25 L 240,17 L 230,25 L 220,17 L 210,25 L 200,17 L 190,25 L 180,17 L 170,25 
    L 160,17 L 150,25 L 140,17 L 130,25 L 120,17 L 110,25 L 100,17 L 90,25 L 80,17 L 70,25 L 60,17 L 50,25 L 40,17 L 30,25 L 20,17 L 10,25 L 0,17 Z
  " class="c-wh" />

  <!-- Lower sawtooth (inverted) -->
  <path d="
    M 0,90 
    L 10,82 L 20,90 L 30,82 L 40,90 L 50,82 L 60,90 L 70,82 L 80,90 L 90,82 L 100,90 L 110,82 L 120,90 L 130,82 L 140,90 L 150,82 L 160,90 
    L 170,82 L 180,90 L 190,82 L 200,90 L 210,82 L 220,90 L 230,82 L 240,90 L 250,82 L 260,90 L 270,82 L 280,90 L 290,82 L 300,90 L 310,82 L 320,90
    L 320,86
    L 310,78 L 300,86 L 290,78 L 280,86 L 270,78 L 260,86 L 250,78 L 240,86 L 230,78 L 220,86 L 210,78 L 200,86 L 190,78 L 180,86 L 170,78 
    L 160,86 L 150,78 L 140,86 L 130,78 L 120,86 L 110,78 L 100,86 L 90,78 L 80,86 L 70,78 L 60,86 L 50,78 L 40,86 L 30,78 L 20,86 L 10,78 L 0,86 Z
  " class="c-tq" />

  <path d="
    M 0,86 
    L 10,78 L 20,86 L 30,78 L 40,86 L 50,78 L 60,86 L 70,78 L 80,86 L 90,78 L 100,86 L 110,78 L 120,86 L 130,78 L 140,86 L 150,78 L 160,86 
    L 170,78 L 180,86 L 190,78 L 200,86 L 210,78 L 220,86 L 230,78 L 240,86 L 250,78 L 260,86 L 270,78 L 280,86 L 290,78 L 300,86 L 310,78 L 320,86
    L 320,83
    L 310,75 L 300,83 L 290,75 L 280,83 L 270,75 L 260,83 L 250,75 L 240,83 L 230,75 L 220,83 L 210,75 L 200,83 L 190,75 L 180,83 L 170,75 
    L 160,83 L 150,75 L 140,83 L 130,75 L 120,83 L 110,75 L 100,83 L 90,75 L 80,83 L 70,75 L 60,83 L 50,75 L 40,83 L 30,75 L 20,83 L 10,75 L 0,83 Z
  " class="c-wh" />

  <!-- Secondary Background Diamonds (Intermediate Rhythm) -->
  <g id="interstitial-stepped-diamonds">
    <!-- Diamond at x=0 & x=320 (seamless edge halves) -->
    <g transform="translate(0, 50)">
      <polygon points="0,-22 22,0 0,22 -22,0" class="c-dr" />
      <polygon points="0,-16 16,0 0,16 -16,0" class="c-rd" />
      <polygon points="0,-10 10,0 0,10 -10,0" class="c-or" />
      <polygon points="0,-5 5,0 0,5 -5,0" class="c-yl" />
    </g>
    <g transform="translate(320, 50)">
      <polygon points="0,-22 22,0 0,22 -22,0" class="c-dr" />
      <polygon points="0,-16 16,0 0,16 -16,0" class="c-rd" />
      <polygon points="0,-10 10,0 0,10 -10,0" class="c-or" />
      <polygon points="0,-5 5,0 0,5 -5,0" class="c-yl" />
    </g>
    <!-- Diamonds at x=80 and x=240 -->
    <g transform="translate(80, 50)">
      <polygon points="0,-22 22,0 0,22 -22,0" class="c-dr" />
      <polygon points="0,-16 16,0 0,16 -16,0" class="c-rd" />
      <polygon points="0,-10 10,0 0,10 -10,0" class="c-or" />
      <polygon points="0,-5 5,0 0,5 -5,0" class="c-yl" />
    </g>
    <g transform="translate(240, 50)">
      <polygon points="0,-22 22,0 0,22 -22,0" class="c-dr" />
      <polygon points="0,-16 16,0 0,16 -16,0" class="c-rd" />
      <polygon points="0,-10 10,0 0,10 -10,0" class="c-or" />
      <polygon points="0,-5 5,0 0,5 -5,0" class="c-yl" />
    </g>
  </g>

  <!-- Central Primary Emblem: Sacred Wixárika Nierika / Hikuri 8-Petal Rosette (x=160, y=50) -->
  <g id="nierika-center" transform="translate(160, 50)">
    <!-- Radiating Diamond stepped base -->
    <polygon points="0,-36 36,0 0,36 -36,0" class="c-bk" />
    <polygon points="0,-33 33,0 0,33 -33,0" class="c-dr" />
    <polygon points="0,-28 28,0 0,28 -28,0" class="c-rd" />
    <polygon points="0,-23 23,0 0,23 -23,0" class="c-or" />
    <polygon points="0,-18 18,0 0,18 -18,0" class="c-yl" />

    <!-- 8 Geometric Petals of Hikuri (Peyote Flower) in Turquoise & White -->
    <!-- 4 Cardinal Petals -->
    <polygon points="0,-26 -6,-14 0,-18 6,-14" class="c-wh" />
    <polygon points="0,26 -6,14 0,18 6,14" class="c-wh" />
    <polygon points="-26,0 -14,-6 -18,0 -14,6" class="c-wh" />
    <polygon points="26,0 14,-6 18,0 14,6" class="c-wh" />

    <polygon points="0,-21 -4,-13 0,-15 4,-13" class="c-tq" />
    <polygon points="0,21 -4,13 0,15 4,13" class="c-tq" />
    <polygon points="-21,0 -13,-4 -15,0 -13,4" class="c-tq" />
    <polygon points="21,0 13,-4 15,0 13,4" class="c-tq" />

    <!-- 4 Diagonal Petals -->
    <g transform="rotate(45)">
      <polygon points="0,-24 -5,-13 0,-17 5,-13" class="c-wh" />
      <polygon points="0,24 -5,13 0,17 5,13" class="c-wh" />
      <polygon points="-24,0 -13,-5 -17,0 -13,5" class="c-wh" />
      <polygon points="24,0 13,-5 17,0 13,5" class="c-wh" />

      <polygon points="0,-19 -4,-12 0,-14 4,-12" class="c-tq" />
      <polygon points="0,19 -4,12 0,14 4,12" class="c-tq" />
      <polygon points="-19,0 -12,-4 -14,0 -12,4" class="c-tq" />
      <polygon points="19,0 12,-4 14,0 12,4" class="c-tq" />
    </g>

    <!-- Center Eye of God (Nierika Heart) -->
    <polygon points="0,-9 9,0 0,9 -9,0" class="c-bk" />
    <polygon points="0,-7 7,0 0,7 -7,0" class="c-ly" />
    <polygon points="0,-4 4,0 0,4 -4,0" class="c-wh" />
    <circle cx="0" cy="0" r="1.8" class="c-rd" />
  </g>

  <!-- Flanking Stepped Chevron Brackets (Connecting rhythms) -->
  <!-- Left Brackets around x=80 -->
  <g class="c-ly">
    <polygon points="72,25 80,31 88,25 88,27 80,33 72,27" />
    <polygon points="72,75 80,69 88,75 88,73 80,67 72,73" />
  </g>
  <!-- Right Brackets around x=240 -->
  <g class="c-ly">
    <polygon points="232,25 240,31 248,25 248,27 240,33 232,27" />
    <polygon points="232,75 240,69 248,75 248,73 240,67 232,73" />
  </g>

  <!-- Chaquira bead dot accents along key contours -->
  <g class="c-wh">
    <!-- Top bead string -->
    <circle cx="20" cy="28" r="1.6" /><circle cx="40" cy="28" r="1.6" /><circle cx="60" cy="28" r="1.6" />
    <circle cx="100" cy="28" r="1.6" /><circle cx="120" cy="28" r="1.6" /><circle cx="140" cy="28" r="1.6" />
    <circle cx="180" cy="28" r="1.6" /><circle cx="200" cy="28" r="1.6" /><circle cx="220" cy="28" r="1.6" />
    <circle cx="260" cy="28" r="1.6" /><circle cx="280" cy="28" r="1.6" /><circle cx="300" cy="28" r="1.6" />
    <!-- Bottom bead string -->
    <circle cx="20" cy="72" r="1.6" /><circle cx="40" cy="72" r="1.6" /><circle cx="60" cy="72" r="1.6" />
    <circle cx="100" cy="72" r="1.6" /><circle cx="120" cy="72" r="1.6" /><circle cx="140" cy="72" r="1.6" />
    <circle cx="180" cy="72" r="1.6" /><circle cx="200" cy="72" r="1.6" /><circle cx="220" cy="72" r="1.6" />
    <circle cx="260" cy="72" r="1.6" /><circle cx="280" cy="72" r="1.6" /><circle cx="300" cy="72" r="1.6" />
  </g>
</svg>
