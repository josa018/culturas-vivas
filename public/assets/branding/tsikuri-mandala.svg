<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Wooden Axis Cross (Traditional Crossed Sticks) -->
  <g stroke="#EDE8DF" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <line x1="256" y1="24" x2="256" y2="488" />
    <line x1="24" y1="256" x2="488" y2="256" />
    <line x1="92" y1="92" x2="420" y2="420" stroke-dasharray="3,6" opacity="0.2" />
    <line x1="92" y1="420" x2="420" y2="92" stroke-dasharray="3,6" opacity="0.2" />
  </g>

  <!-- Concentric Diamond Yarn Layers (Tsikuri / Ojo de Dios) -->
  <!-- Layer 5: Outer Turquoise Frame with Corner Beads -->
  <polygon points="256,48 464,256 256,464 48,256" fill="none" stroke="#008F85" stroke-width="12" />
  <polygon points="256,62 450,256 256,450 62,256" fill="none" stroke="#0B0F17" stroke-width="4" />

  <!-- Layer 4: Solar Gold (Tau / Cempasuchil) -->
  <polygon points="256,76 436,256 256,436 76,256" fill="none" stroke="#D99B26" stroke-width="18" />

  <!-- Layer 3: Obsidian Contrast Ring -->
  <polygon points="256,98 414,256 256,414 98,256" fill="none" stroke="#141923" stroke-width="8" />

  <!-- Layer 2: Cochineal Vermilion (Tatewari / Sacred Fire) -->
  <polygon points="256,112 400,256 256,400 112,256" fill="none" stroke="#B83A2C" stroke-width="22" filter="url(#subtleGlow)" />

  <!-- Layer 1: Sacred Water Turquoise Band -->
  <polygon points="256,140 372,256 256,372 140,256" fill="none" stroke="#008F85" stroke-width="20" />

  <!-- Inner Diamond Sequence: Solar Core -->
  <polygon points="256,166 346,256 256,346 166,256" fill="none" stroke="#D99B26" stroke-width="16" />
  <polygon points="256,188 324,256 256,324 188,256" fill="none" stroke="#B83A2C" stroke-width="14" />
  <polygon points="256,208 304,256 256,304 208,256" fill="none" stroke="#EDE8DF" stroke-width="10" />
  <polygon points="256,224 288,256 256,288 224,256" fill="none" stroke="#008F85" stroke-width="8" />
  
  <!-- Central Center Eye (Center Pupil of the Cosmos) -->
  <polygon points="256,236 276,256 256,276 236,256" fill="#D99B26" stroke="#EDE8DF" stroke-width="3" />

  <!-- 4 Cardinal Directional Sacred Beads -->
  <circle cx="256" cy="48" r="7" fill="#EDE8DF" stroke="#B83A2C" stroke-width="2" />
  <circle cx="464" cy="256" r="7" fill="#EDE8DF" stroke="#B83A2C" stroke-width="2" />
  <circle cx="256" cy="464" r="7" fill="#EDE8DF" stroke="#B83A2C" stroke-width="2" />
  <circle cx="48" cy="256" r="7" fill="#EDE8DF" stroke="#B83A2C" stroke-width="2" />
</svg>
