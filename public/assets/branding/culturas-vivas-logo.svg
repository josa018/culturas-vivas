<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cultural Palette Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Harmony Ring (Cosmic Horizon) -->
  <circle cx="256" cy="256" r="236" stroke="#EDE8DF" stroke-width="1.5" stroke-opacity="0.18" />
  <circle cx="256" cy="256" r="236" stroke="#D99B26" stroke-width="2" stroke-dasharray="4 28" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Diagonal Connecting Lozenges (Cardinal Harmony Links) -->
  <g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- NE: Wixárika / Cora Link -->
    <polygon points="340,172 364,148 352,136 328,160" fill="#141923" stroke="#D99B26" stroke-opacity="0.5" />
    <circle cx="346" cy="154" r="2.5" fill="#D99B26" />

    <!-- SE: Cora / O'dam Link -->
    <polygon points="340,340 364,364 352,376 328,352" fill="#141923" stroke="#B83A2C" stroke-opacity="0.5" />
    <circle cx="346" cy="358" r="2.5" fill="#B83A2C" />

    <!-- SW: O'dam / Mexicanero Link -->
    <polygon points="172,340 148,364 136,352 160,328" fill="#141923" stroke="#EDE8DF" stroke-opacity="0.5" />
    <circle cx="154" cy="346" r="2.5" fill="#EDE8DF" />

    <!-- NW: Mexicanero / Wixárika Link -->
    <polygon points="172,172 148,148 136,160 160,184" fill="#141923" stroke="#008F85" stroke-opacity="0.5" />
    <circle cx="154" cy="166" r="2.5" fill="#008F85" />
  </g>

  <!-- ======================================================== -->
  <!-- 1. NORTH: WIXÁRIKA (Tsikuri Ojo de Dios / Flor Híkuri)   -->
  <!-- Pigment: Cempasúchil Solar Gold (#D99B26)               -->
  <!-- ======================================================== -->
  <g id="quadrant-wixarika">
    <!-- Outer Tsikuri Rhombus Petal -->
    <polygon points="256,36 304,152 256,206 208,152" fill="#141923" stroke="#D99B26" stroke-width="3" stroke-linejoin="round" filter="url(#subtleGlow)" />
    
    <!-- Concentric Yarn Layers -->
    <polygon points="256,66 290,152 256,190 222,152" fill="#0B0F17" stroke="#D99B26" stroke-width="2" stroke-opacity="0.8" />
    <polygon points="256,96 276,152 256,174 236,152" fill="#141923" stroke="#EDE8DF" stroke-width="1.8" />
    <polygon points="256,122 266,152 256,160 246,152" fill="#D99B26" stroke="none" />

    <!-- Tip Peyote Petal Bead Accent -->
    <circle cx="256" cy="36" r="5" fill="#D99B26" stroke="#EDE8DF" stroke-width="1.5" />
    <line x1="256" y1="20" x2="256" y2="31" stroke="#D99B26" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. EAST: NÁAYERI / CORA (Lucero Sautari / Greca Textil)  -->
  <!-- Pigment: Rojo Grana Cochinilla (#B83A2C)                 -->
  <!-- ======================================================== -->
  <g id="quadrant-naayeri">
    <!-- Stepped Morning Star (Sautari) Petal -->
    <polygon points="476,256 360,208 306,256 360,304" fill="#141923" stroke="#B83A2C" stroke-width="3" stroke-linejoin="round" filter="url(#subtleGlow)" />
    
    <!-- Traditional Stepped Loom Fretwork (Greca Escalonada) -->
    <path d="M446,256 L410,234 L386,244 L370,230 L346,256 L370,282 L386,268 L410,278 Z" fill="#0B0F17" stroke="#B83A2C" stroke-width="2" stroke-opacity="0.8" />
    <polygon points="384,256 360,244 340,256 360,268" fill="#B83A2C" stroke="#EDE8DF" stroke-width="1.5" />

    <!-- Morning Star Tip Bead -->
    <circle cx="476" cy="256" r="5" fill="#B83A2C" stroke="#EDE8DF" stroke-width="1.5" />
    <line x1="481" y1="256" x2="492" y2="256" stroke="#B83A2C" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ======================================================== -->
  <!-- 3. SOUTH: O'DAM / TEPEHUANO (Sol del Mitote y Sierra)    -->
  <!-- Pigment: Blanco Hueso (#EDE8DF)                          -->
  <!-- ======================================================== -->
  <g id="quadrant-odam">
    <!-- Sacred Mitote Sun Petal -->
    <polygon points="256,476 208,360 256,306 304,360" fill="#141923" stroke="#EDE8DF" stroke-width="3" stroke-linejoin="round" filter="url(#subtleGlow)" />
    
    <!-- Radiating Solar Spoke Lines (Ceremonial Dance Ray Architecture) -->
    <polygon points="256,446 222,360 256,322 290,360" fill="#0B0F17" stroke="#EDE8DF" stroke-width="2" stroke-opacity="0.8" />
    <line x1="256" y1="432" x2="256" y2="336" stroke="#D99B26" stroke-width="2" stroke-linecap="round" />
    <line x1="240" y1="390" x2="272" y2="390" stroke="#EDE8DF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="246" y1="410" x2="266" y2="410" stroke="#EDE8DF" stroke-width="1.5" stroke-linecap="round" />

    <!-- Southern Sun Bead Accent -->
    <circle cx="256" cy="476" r="5" fill="#EDE8DF" stroke="#D99B26" stroke-width="1.5" />
    <line x1="256" y1="481" x2="256" y2="492" stroke="#EDE8DF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ======================================================== -->
  <!-- 4. WEST: MEXICANERO (Semilla de Maíz y Espiral de Agua)  -->
  <!-- Pigment: Turquesa Sagrado (#008F85)                      -->
  <!-- ======================================================== -->
  <g id="quadrant-mexicanero">
    <!-- Sacred Maize Seed Petal -->
    <polygon points="36,256 152,304 206,256 152,208" fill="#141923" stroke="#008F85" stroke-width="3" stroke-linejoin="round" filter="url(#subtleGlow)" />
    
    <!-- Water Spiral / Germination Heart Curve -->
    <path d="M66,256 C90,230 130,232 152,256 C130,280 90,282 66,256 Z" fill="#0B0F17" stroke="#008F85" stroke-width="2" stroke-opacity="0.8" />
    <path d="M102,256 C114,244 134,246 142,256 C134,266 114,268 102,256 Z" fill="#008F85" stroke="#EDE8DF" stroke-width="1.5" />

    <!-- Western Water Bead Accent -->
    <circle cx="36" cy="256" r="5" fill="#008F85" stroke="#EDE8DF" stroke-width="1.5" />
    <line x1="20" y1="256" x2="31" y2="256" stroke="#008F85" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ======================================================== -->
  <!-- CENTER: AXIS MUNDI (Punto de Encuentro de las 4 Culturas)-->
  <!-- ======================================================== -->
  <g id="axis-mundi">
    <!-- Unifying Outer Halo -->
    <circle cx="256" cy="256" r="48" fill="#141923" stroke="#EDE8DF" stroke-width="2.5" stroke-opacity="0.9" />
    
    <!-- 4 Colored Radial Anchors linking to the 4 directions -->
    <path d="M256,212 L262,246 L256,256 L250,246 Z" fill="#D99B26" /> <!-- North Gold -->
    <path d="M300,256 L266,262 L256,256 L266,250 Z" fill="#B83A2C" /> <!-- East Red -->
    <path d="M256,300 L250,266 L256,256 L262,266 Z" fill="#EDE8DF" /> <!-- South Bone -->
    <path d="M212,256 L246,250 L256,256 L246,262 Z" fill="#008F85" /> <!-- West Teal -->

    <!-- Inner Golden Sun Disk -->
    <circle cx="256" cy="256" r="22" fill="#0B0F17" stroke="#D99B26" stroke-width="2.5" />
    <circle cx="256" cy="256" r="10" fill="#D99B26" />
    <circle cx="256" cy="256" r="3.5" fill="#EDE8DF" />
  </g>
</svg>
