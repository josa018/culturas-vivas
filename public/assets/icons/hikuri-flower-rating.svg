<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- 5 Sacred Faceted Híkuri Petals (Wixárika Diamond Geometry) -->
  <g stroke="#D99B26" stroke-width="1.2" stroke-linejoin="round" fill="#141923">
    <!-- Top Petal -->
    <polygon points="16,5 19.2,11.6 16,13.8 12.8,11.6" />
    <polygon points="16,7.5 18,11.5 16,13 14,11.5" fill="#D99B26" stroke="none" opacity="0.85" />

    <!-- Top-Right Petal -->
    <polygon points="26.5,12.6 21.2,17.7 18.2,15 19.2,11.6" />
    <polygon points="24.2,13.5 20.5,17 18.8,15.2 19.5,13" fill="#D99B26" stroke="none" opacity="0.85" />

    <!-- Bottom-Right Petal -->
    <polygon points="22.5,24.9 16,21.5 17.2,17.6 21.2,17.7" />
    <polygon points="21,22.8 16.5,20.5 17.5,18 20.2,18" fill="#D99B26" stroke="none" opacity="0.85" />

    <!-- Bottom-Left Petal -->
    <polygon points="9.5,24.9 16,21.5 14.8,17.6 10.8,17.7" />
    <polygon points="11,22.8 15.5,20.5 14.5,18 11.8,18" fill="#D99B26" stroke="none" opacity="0.85" />

    <!-- Top-Left Petal -->
    <polygon points="5.5,12.6 12.8,11.6 13.8,15 10.8,17.7" />
    <polygon points="7.8,13.5 12.5,13 13.2,15.2 11.5,17" fill="#D99B26" stroke="none" opacity="0.85" />
  </g>

  <!-- 5 Cardinal Chaquira Tip Beads -->
  <circle cx="16" cy="5" r="1.3" fill="#D99B26" stroke="#EDE8DF" stroke-width="0.8" />
  <circle cx="26.5" cy="12.6" r="1.3" fill="#D99B26" stroke="#EDE8DF" stroke-width="0.8" />
  <circle cx="22.5" cy="24.9" r="1.3" fill="#D99B26" stroke="#EDE8DF" stroke-width="0.8" />
  <circle cx="9.5" cy="24.9" r="1.3" fill="#D99B26" stroke="#EDE8DF" stroke-width="0.8" />
  <circle cx="5.5" cy="12.6" r="1.3" fill="#D99B26" stroke="#EDE8DF" stroke-width="0.8" />

  <!-- Sacred Axis Mundi Core -->
  <circle cx="16" cy="16" r="4.2" fill="#141923" stroke="#D99B26" stroke-width="1.3" />
  <circle cx="16" cy="16" r="2.2" fill="#D99B26" />
  <circle cx="16" cy="16" r="0.8" fill="#EDE8DF" />
</svg>
