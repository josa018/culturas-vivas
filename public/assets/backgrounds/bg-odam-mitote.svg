<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <!-- O'dam / Tepehuano Ceremonial Solar Mitote & Sierra Pines (Brightened Monochrome Watermark) -->

  <!-- Concentric Mitote Dance Rings -->
  <circle cx="160" cy="160" r="120" stroke="#EDE8DF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 6" />
  <circle cx="160" cy="160" r="90" stroke="#EDE8DF" stroke-width="1.2" stroke-opacity="0.11" />
  <circle cx="160" cy="160" r="60" stroke="#EDE8DF" stroke-width="0.9" stroke-opacity="0.08" stroke-dasharray="2 4" />
  <circle cx="160" cy="160" r="30" fill="#EDE8DF" fill-opacity="0.035" stroke="#EDE8DF" stroke-width="1.3" stroke-opacity="0.12" />

  <!-- 12 Radiating Dance Pathway Spokes -->
  <g stroke="#EDE8DF" stroke-width="1" stroke-opacity="0.09" stroke-linecap="round">
    <line x1="160" y1="35" x2="160" y2="130" stroke-width="1.3" stroke-opacity="0.13" />
    <line x1="160" y1="190" x2="160" y2="285" stroke-width="1.3" stroke-opacity="0.13" />
    <line x1="35" y1="160" x2="130" y2="160" stroke-width="1.3" stroke-opacity="0.13" />
    <line x1="190" y1="160" x2="285" y2="160" stroke-width="1.3" stroke-opacity="0.13" />

    <line x1="97" y1="52" x2="145" y2="134" />
    <line x1="223" y1="52" x2="175" y2="134" />
    <line x1="97" y1="268" x2="145" y2="186" />
    <line x1="223" y1="268" x2="175" y2="186" />
    <line x1="52" y1="97" x2="134" y2="145" />
    <line x1="268" y1="97" x2="186" y2="145" />
    <line x1="52" y1="223" x2="134" y2="175" />
    <line x1="268" y1="223" x2="186" y2="175" />
  </g>

  <!-- Sierra Madre Pine Needles & Peak Chevrons -->
  <g stroke="#EDE8DF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.10">
    <path d="M150,55 L160,35 L170,55 M145,68 L160,48 L175,68" />
    <path d="M150,265 L160,285 L170,265 M145,252 L160,272 L175,252" />
    <path d="M55,150 L35,160 L55,170 M68,145 L48,160 L68,175" />
    <path d="M265,150 L285,160 L265,170 M252,145 L272,160 L252,175" />
  </g>

  <!-- Perimeter Sun Beads -->
  <circle cx="160" cy="35" r="2.2" fill="#EDE8DF" fill-opacity="0.14" />
  <circle cx="160" cy="285" r="2.2" fill="#EDE8DF" fill-opacity="0.14" />
  <circle cx="35" cy="160" r="2.2" fill="#EDE8DF" fill-opacity="0.14" />
  <circle cx="285" cy="160" r="2.2" fill="#EDE8DF" fill-opacity="0.14" />

  <!-- Center Hearth -->
  <circle cx="160" cy="160" r="8" fill="#EDE8DF" fill-opacity="0.04" stroke="#EDE8DF" stroke-width="1" stroke-opacity="0.12" />
  <circle cx="160" cy="160" r="2.5" fill="#EDE8DF" fill-opacity="0.16" />
</svg>
