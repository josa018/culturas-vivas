<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <!-- Wixárika Sacred Astral Constellation & Kauyumari (Brightened Monochrome Watermark) -->
  
  <!-- Constellation Connecting Lines -->
  <g stroke="#EDE8DF" stroke-width="0.9" stroke-dasharray="3 4" stroke-opacity="0.08" stroke-linecap="round">
    <line x1="160" y1="40" x2="160" y2="100" />
    <line x1="160" y1="100" x2="110" y2="70" />
    <line x1="160" y1="100" x2="210" y2="70" />
    <line x1="110" y1="70" x2="80" y2="90" />
    <line x1="210" y1="70" x2="240" y2="90" />
    <line x1="160" y1="100" x2="160" y2="170" />
    <line x1="160" y1="170" x2="110" y2="230" />
    <line x1="160" y1="170" x2="210" y2="230" />
    <line x1="110" y1="230" x2="160" y2="280" />
    <line x1="210" y1="230" x2="160" y2="280" />
    <line x1="70" y1="160" x2="160" y2="170" />
    <line x1="250" y1="160" x2="160" y2="170" />
  </g>

  <!-- Kauyumari Head & Antlers Geometry -->
  <g stroke="#EDE8DF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.12">
    <path d="M160,110 L160,65 M160,65 L135,45 M160,65 L185,45 M135,45 L115,55 M185,45 L205,55 M145,35 L135,45 M175,35 L185,45" />
    <polygon points="140,110 160,85 180,110 175,150 160,175 145,150" fill="#EDE8DF" fill-opacity="0.03" />
    <polygon points="160,105 168,118 160,130 152,118" fill="#EDE8DF" fill-opacity="0.06" stroke="#EDE8DF" stroke-width="1" stroke-opacity="0.15" />
  </g>

  <!-- Surrounding Tsikuri Stars -->
  <g transform="translate(160, 40)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#EDE8DF" fill-opacity="0.05" stroke="#EDE8DF" stroke-width="1" stroke-opacity="0.12" />
    <circle cx="0" cy="0" r="1.5" fill="#EDE8DF" fill-opacity="0.16" />
  </g>

  <g transform="translate(70, 160)">
    <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#EDE8DF" fill-opacity="0.04" stroke="#EDE8DF" stroke-width="0.9" stroke-opacity="0.10" />
    <circle cx="0" cy="0" r="1.2" fill="#EDE8DF" fill-opacity="0.14" />
  </g>

  <g transform="translate(250, 160)">
    <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#EDE8DF" fill-opacity="0.04" stroke="#EDE8DF" stroke-width="0.9" stroke-opacity="0.10" />
    <circle cx="0" cy="0" r="1.2" fill="#EDE8DF" fill-opacity="0.14" />
  </g>

  <g transform="translate(160, 280)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#EDE8DF" fill-opacity="0.05" stroke="#EDE8DF" stroke-width="1" stroke-opacity="0.12" />
    <circle cx="0" cy="0" r="1.5" fill="#EDE8DF" fill-opacity="0.16" />
  </g>

  <!-- Nodal Beads -->
  <circle cx="110" cy="70" r="2" fill="#EDE8DF" fill-opacity="0.13" />
  <circle cx="210" cy="70" r="2" fill="#EDE8DF" fill-opacity="0.13" />
  <circle cx="80" cy="90" r="1.6" fill="#EDE8DF" fill-opacity="0.11" />
  <circle cx="240" cy="90" r="1.6" fill="#EDE8DF" fill-opacity="0.11" />
  <circle cx="110" cy="230" r="2" fill="#EDE8DF" fill-opacity="0.13" />
  <circle cx="210" cy="230" r="2" fill="#EDE8DF" fill-opacity="0.13" />
</svg>
