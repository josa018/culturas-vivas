<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <!-- Náayeri / Cora Sautari Astral Star & Open Loom Chevrons (Brightened Monochrome Watermark) -->

  <!-- 4 Diagonal Dashed Astral Pathways -->
  <g stroke="#EDE8DF" stroke-width="0.9" stroke-dasharray="3 4" stroke-opacity="0.08" stroke-linecap="round">
    <line x1="160" y1="160" x2="80" y2="80" />
    <line x1="160" y1="160" x2="240" y2="80" />
    <line x1="160" y1="160" x2="80" y2="240" />
    <line x1="160" y1="160" x2="240" y2="240" />
  </g>

  <!-- 4 Cardinal Linear Staves -->
  <g stroke="#EDE8DF" stroke-width="1.3" stroke-opacity="0.12" stroke-linecap="round">
    <line x1="160" y1="146" x2="160" y2="50" />
    <line x1="160" y1="174" x2="160" y2="270" />
    <line x1="146" y1="160" x2="50" y2="160" />
    <line x1="174" y1="160" x2="270" y2="160" />
  </g>

  <!-- Traditional Cora Woven Chevrons (Open Wireframe) -->
  <g stroke="#EDE8DF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.10">
    <path d="M150,110 L160,95 L170,110 M145,85 L160,65 L175,85" />
    <path d="M150,210 L160,225 L170,210 M145,235 L160,255 L175,235" />
    <path d="M110,150 L95,160 L110,170 M85,145 L65,160 L85,175" />
    <path d="M210,150 L225,160 L210,170 M235,145 L255,160 L235,175" />
  </g>

  <!-- Diagonal Satellite Diamond Starlets (Open Wireframe) -->
  <g stroke="#EDE8DF" stroke-width="1" stroke-opacity="0.10" stroke-linejoin="round">
    <polygon points="80,72 88,80 80,88 72,80" />
    <polygon points="240,72 248,80 240,88 232,80" />
    <polygon points="80,232 88,240 80,248 72,240" />
    <polygon points="240,232 248,240 240,248 232,240" />
  </g>

  <!-- Compact Center Sautari Core -->
  <polygon points="160,146 174,160 160,174 146,160" fill="#EDE8DF" fill-opacity="0.04" stroke="#EDE8DF" stroke-width="1.3" stroke-opacity="0.14" stroke-linejoin="round" />
  <rect x="151" y="151" width="18" height="18" stroke="#EDE8DF" stroke-width="0.9" stroke-opacity="0.09" stroke-dasharray="2 2" />
  <circle cx="160" cy="160" r="2" fill="#EDE8DF" fill-opacity="0.16" />

  <!-- Nodal Chaquira Tip Beads -->
  <circle cx="160" cy="50" r="2" fill="#EDE8DF" fill-opacity="0.13" />
  <circle cx="160" cy="270" r="2" fill="#EDE8DF" fill-opacity="0.13" />
  <circle cx="50" cy="160" r="2" fill="#EDE8DF" fill-opacity="0.13" />
  <circle cx="270" cy="160" r="2" fill="#EDE8DF" fill-opacity="0.13" />
  <circle cx="80" cy="80" r="1.6" fill="#EDE8DF" fill-opacity="0.12" />
  <circle cx="240" cy="80" r="1.6" fill="#EDE8DF" fill-opacity="0.12" />
  <circle cx="80" cy="240" r="1.6" fill="#EDE8DF" fill-opacity="0.12" />
  <circle cx="240" cy="240" r="1.6" fill="#EDE8DF" fill-opacity="0.12" />
</svg>
